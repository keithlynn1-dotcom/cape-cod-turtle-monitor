name: Daily Cape Cod Turtle Monitor
on:
 schedule:
   - cron: '0 6 * * *'
 workflow_dispatch:
jobs:
 run-agent:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'
     - name: Run Monitoring Agent
       env:
         TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
         TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
         TWILIO_FROM_PHONE: ${{ secrets.TWILIO_FROM_PHONE }}
         ALERT_TO_PHONE: ${{ secrets.ALERT_TO_PHONE }}
       run: |
         python -m pip install --upgrade pip
         pip install requests pandas numpy scikit-learn twilio
         python main.py
