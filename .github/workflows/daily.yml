name: Daily Cape Cod Turtle Monitor
on:
 schedule:
   # Runs automatically every day at 06:00 UTC (1:00 AM EDT / 2:00 AM EST)
   - cron: '0 6 * * *'
 workflow_dispatch: # Allows you to run it manually anytime with a button click
jobs:
 run-agent:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'
     - name: Install dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
     - name: Run Monitoring Agent
       env:
         TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
         TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
         TWILIO_FROM_PHONE: ${{ secrets.TWILIO_FROM_PHONE }}
         ALERT_TO_PHONE: ${{ secrets.ALERT_TO_PHONE }}
       run: python main.py
